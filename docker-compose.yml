services:
  postgres:
    image: postgres:16
    container_name: burdenoff_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: burdenoff
      POSTGRES_PASSWORD: burdenoff_password
      POSTGRES_DB: burdenoff_sla
    ports:
      - "5432:5432"
    volumes:
      - burdenoff_postgres_data:/var/lib/postgresql/data

volumes:
  burdenoff_postgres_data: